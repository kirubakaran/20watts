<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>20watts</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #e9e6df; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 16px; bottom: 16px; z-index: 5;
        font: 13px/1.6 system-ui, sans-serif; color: #3a3832;
        background: rgba(255,255,255,0.72); border-radius: 8px; overflow: hidden;
        pointer-events: none; max-width: 400px;
      }
      #hud .title {
        background: rgba(58,56,50,0.08); padding: 7px 12px; margin-bottom: 4px;
        border-bottom: 1px solid rgba(58,56,50,0.12);
      }
      #hud .title b { font-weight: 600; letter-spacing: 0.01em; }
      #hud .rows { display: grid; grid-template-columns: max-content 1fr; column-gap: 12px; row-gap: 2px; padding: 4px 12px 9px; }
      #hud .rows + .rows { border-top: 1px solid rgba(58,56,50,0.12); margin-top: 2px; padding-top: 7px; }
      #hud .lead { color: #8a857c; }
      #hud .nw { white-space: nowrap; }
      #hud kbd {
        display: inline-block; font: 11.5px/1 ui-monospace, Menlo, monospace;
        padding: 3px 5px 2px; border-radius: 4px; vertical-align: 1px;
        background: rgba(255,255,255,0.9); border: 1px solid rgba(58,56,50,0.25);
        box-shadow: 0 1px 0 rgba(58,56,50,0.25); color: #2a2824;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div class="title"><b>20watts</b> · Behold the works of 20-watt brains.</div>
      <div class="rows">
        <span class="lead">In VR</span><span>sticks move · <span class="nw"><kbd>A</kbd> <kbd>B</kbd> eras</span> · <span class="nw"><kbd>X</kbd> <kbd>Y</kbd> west / east</span></span>
      </div>
      <div class="rows">
        <span class="lead">Look</span><span>click, then move the mouse · <span class="nw"><kbd>Esc</kbd> releases it</span></span>
        <span class="lead">Walk</span><span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> · <span class="nw">hold <kbd>Shift</kbd> to run</span></span>
        <span class="lead">Hop</span><span><span class="nw"><kbd>[</kbd> <kbd>]</kbd> era back / forward</span> · <span class="nw"><kbd>,</kbd> <kbd>.</kbd> west / east</span></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
