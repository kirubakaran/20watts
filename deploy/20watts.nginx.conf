# nginx site for the museum. Plain HTTP as written;
# run certbot afterwards and it adds the TLS listeners itself, as on the
# other sites. WebXR refuses plain HTTP, so do run it.
#
# Install (as root):
#   cp 20watts.nginx.conf /etc/nginx/sites-available/20watts.conf
#   # check the deploy user's home below
#   ln -s ../sites-available/20watts.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d 20watts.org -d www.20watts.org
#
# nginx (www-data) must be able to traverse the deploy user's home; the
# default 755 is fine.

server {
  listen 80;
  listen [::]:80;
  server_name 20watts.org www.20watts.org;

  # glb is missing from the stock mime.types.
  include /etc/nginx/mime.types;
  types { model/gltf-binary glb; }

  gzip on;
  gzip_types application/javascript text/css application/json model/gltf-binary;

  # The collection: originals never leave the server, derived rungs are served.
  location /assets/ {
    alias /home/twentywatts/data/derived/;
    expires 1d;
    add_header Cache-Control "public";
  }

  # The site: a symlink to the current release, swapped by scripts/deploy.sh.
  root /home/twentywatts/site/current;

  # Vite names its bundle by content hash, so it can be cached forever.
  location /app/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~ ^/(draco|env|fonts)/ {
    expires 1y;
    add_header Cache-Control "public";
  }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = / { add_header Cache-Control "no-cache"; }
}
